#フィールド名
activityName=活動名
activityDate=活動日
activityPlace=活動場所
activityStartTime=活動時間(自)
activityEndTime=活動時間(至)
activityDescription=活動説明
maxParticipant=募集人数
isDateValid=時間の前後関係


#バリデーションエラーメッセージ
NotBlank={0}の入力は必須です。
Pattern={0}は半角英数字で入力してください。
Size={0}は{1}文字以内で入力してください。
NotNull={0}の入力は必須です。
DateTimeFormat=入力された{0}は無効な日付形式です。日付形式はyyyy-MM-ddである必要があります。
Future={0}は明日以降で入力してください。
Pattern.activityStartTime={0}はhh:mm形式で入力してください。
Pattern.activityEndTime={0}はhh:mm形式で入力してください。
AssertTrue=活動開始時間は終了時間より以前の時間を入力してください。
Pattern.maxParticipant={0}は半角数字で入力してください。
Min={0}は{1}人以上を入力してください。
Max={0}は{1}人以下を入力してください。
