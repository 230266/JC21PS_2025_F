<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/ActivityRegistration.css}">
  </head>
  <body>
    <div class="screen">
      <div class="div">
        <!--ヘッダー-->
        <div class="sidebar">
          <div th:replace="header"></div>
          <div class="title">社内イベント管理</div>
        </div>
        <div class="overlap">
          <form role="form" th:action="@{/registerActivity/save}" th:object="${registerActivitySaveForm}" method="post">
           <input type="hidden" name=registClubName value=""/>
            <div class="overlap-group">
              <div class="form-field">
                <div class="label-description">
                  <div class="div-2">
                    <div class="label-wrapper">
                      <div class="div-2"><div class="label">*活動場所</div></div>
                    </div>
                  </div>
                </div>
                <div class="input">
                  <div class="input-base">
                    <div class="error-rectangle">
                      <!-- <input class="text" placeholder="活動場所を入力してください" type="text" th:field="*{activityPlace}"/> -->
                      <input class="text" placeholder="活動場所を入力してください" type="text" th:field="*{activityPlace}"/>
                      <div th:if="${#fields.hasErrors('activityPlace')}">
                        <ul class="error-list">
                          <li th:each="error : ${#fields.errors('activityPlace')}" th:text="${error}"></li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-field-2">
                <div class="label-description">
                  <div class="div-2">
                    <div class="label-wrapper">
                      <div class="div-2"><div class="label">*募集人数</div></div>
                    </div>
                  </div>
                </div>
                <div class="input">
                  <div class="input-base">
                    <div class="error-rectangle">
                      <!-- <div class="input-text"><input class="text" placeholder="募集人数を入力してください" type="text" name="maxParticipant"></div> -->
                      <input class="text" placeholder="募集人数を入力してください" type="text" th:field="*{maxParticipant}"/>
                      <div th:if="${#fields.hasErrors('maxParticipant')}">
                        <ul class="error-list">
                          <li th:each="error : ${#fields.errors('maxParticipant')}" th:text="${error}"></li>
                        </ul>
                        <!-- <ul class="error-list" th:if="${#fields.hasErrors('maxParticipant')}">
                          <li th:errors="*{maxParticipant}"></li>
                        </ul> -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-field-3">
                <div class="label-description">
                  <div class="div-2">
                    <div class="label-wrapper">
                      <div class="div-2"><div class="label">活動説明</div></div>
                      <div class="elements-label"><div class="optional"></div></div>
                    </div>
                  </div>
                </div>
                <div class="text-area">
                  <div class="text-area-base">
                    <textarea class="input-area" placeholder="活動説明を入力してください" type="text" th:field="*{activityDescription}"></textarea>
                    <div th:if="${#fields.hasErrors('activityDescription')}">
                        <ul class="error-list">
                          <li th:each="error : ${#fields.errors('activityDescription')}" th:text="${error}"></li>
                        </ul>
                      <!-- <ul class="error-list" th:if="${#fields.hasErrors('activityDescription')}">
                        <li th:errors="*{activityDescription}"></li>
                      </ul> -->
                    </div>
                    <div class="text-area-icon">
                      <div class="overlap-group-2">
                        <img class="rectangle" src="https://c.animaapp.com/dcFBotWX/img/rectangle-10.svg" />
                        <img class="img" src="https://c.animaapp.com/dcFBotWX/img/rectangle-11.svg" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="date-picker">
                <div class="elements-trigger">
                  <div class="button">
                    <div class="button-base">
                      <div class="button-icon">
                        <img class="icon" src="https://c.animaapp.com/dcFBotWX/img/icon-21.svg" />
                      </div>
                    </div>
                  </div>
                  <div class="date-input">
                    <div class="input-base-wrapper">
                      <div class="input-base-2">
                        <div class="error-rectangle">
                          <div class="input-text-wrapper">
                            <div class="input-text">
                              <input type="date" name="activityDate" placeholder="YYYY/MM/DD" th:field="*{activityDate}"/>
                              <div th:if="${#fields.hasErrors('activityDescription')}">
                                <ul class="error-list">
                                  <li th:each="error : ${#fields.errors('activityDescription')}" th:text="${error}"></li>
                                </ul>
                              </div>
                        <!-- </div> -->
                        <!-- <div th:if="${#fields.hasErrors('activityDate')}" th:errors="*{activityDate}"></div> --> 
                        <!-- エラーメッセージ --> 
                        <!-- <div th:if="${impossibleDate}" style="color: red;" th:text="${impossibleDate}"></div> -->
                        <!-- <div th:if="${errors}" style="color: red;" th:text="${errors}"></div> -->
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="overlap-2">
              <div class="div-wrapper">
                <div class="input-base-2">
                  <div class="error-rectangle">
                    <div class="input-text">
                      <input class="text" placeholder="hh:mm" type="time" th:field="*{activityStartTime}"/>
                      <div th:if="${#fields.hasErrors('activityStartTime')}">
                        <ul class="error-list">
                          <li th:each="error : ${#fields.errors('activityDescription')}" th:text="${error}"></li>
                        </ul>
                      </div>
                    </div>
                  </div>
                  <!-- <ul class="error-list" th:if="${#fields.hasErrors('activityStartTime')}">
                    <li th:errors="*{activityStartTime}"></li>
                  </ul> -->
                </div>
              </div>
              <div class="text-wrapper-3">〜</div>
            </div>
            <div class="input-2">
              <div class="input-base-2">
                <div class="error-rectangle">
                  <div class="input-text-wrapper">
                    <input class="text" placeholder="hh:mm" type="time" th:field="*{activityEndTime}"/>
                    <div th:if="${#fields.hasErrors('activityEndTime')}">
                      <ul class="error-list">
                        <li th:each="error : ${#fields.errors('activityEndTime')}" th:text="${error}"></li>
                      </ul>
                    </div>
                  </div>
                    <!-- <ul class="error-list" th:if="${#fields.hasErrors('activityEndTime')}">
                      <li th:errors="*{activityEndTime}"></li>
                    </ul>
                    <ul class="error-list" th:if="${#fields.hasErrors('isDateValid')}">
                      <li th:errors="*{isDateValid}"></li>
                    </ul> -->
                </div>
              </div>
            </div>
            </div>
            <div class="form-field-4">
              <div class="label-description">
                <div class="div-2">
                  <div class="label-wrapper">
                    <div class="div-2"><div class="label">*活動名</div></div>
                  </div>
                </div>
              </div>
              <div class="input">
                <div class="input-base">
                  <div class="error-rectangle">
                    <input class="text" placeholder="活動名を入力してください" type="text" th:field="*{activityName}"/>
                    <!-- エラーメッセージ -->
                    <!-- <div th:if="${#fields.hasErrors('activityName')}"> -->
                    <div th:if="${#fields != null and #fields.hasErrors('activityName')}">
                      <ul class="error-list">
                        <li th:each="error : ${#fields.errors('activityName')}" th:text="${error}"></li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="label-description-2">
              <div class="div-2">
                <div class="label-wrapper">
                  <div class="div-2"><div class="label">部署名</div></div>
                </div>
              </div>
            </div>
            <div class="label-description-3">
              <div class="div-2">
                <div class="label-wrapper">
                  <div class="div-2"><div class="label-2" th:text="${registerActivityForm.clubName}"></div></div>
                </div>
              </div>
            </div>
            <div class="label-description-4">
              <div class="div-2">
                <div class="label-wrapper">
                  <div class="div-2"><div class="label">*活動日</div></div>
                </div>
              </div>
            </div>
            <div class="label-description-5">
              <div class="div-2">
                <div class="label-wrapper">
                  <div class="div-2"><div class="label">*活動時間</div></div>
                </div>
              </div>
            </div>
            <div class="frame">
              <div class="div-2">
                <button class="button-2" type="submit">
                  <div class="button-base-3">
                    <div class="button-text-2">登録</div></div>
                </button>
              </div>
            </div>
          </form>
          <form action="/top" method="post">
            <button class="button-base-wrapper" type="submit">
              <div class="button-base-2"><div class="button-text">戻る</div></div>
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
