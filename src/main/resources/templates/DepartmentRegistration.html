<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="DepartmentRegistration.css" />
  </head>
  <body>
    <div class="screen">
      <div class="div">
        <div class="label-description">
          <div class="div-2">
            <div class="label-wrapper">
              <div class="div-2"><div class="label">*部署名</div></div>
            </div>
          </div>
        </div>
        <div class="label-description-2">
          <div class="div-2">
            <div class="label-wrapper">
              <div class="div-2"><div class="text-wrapper">ITインテグレーション部門</div></div>
            </div>
          </div>
        </div>
        <div class="sidebar">
          <div class="list">
            <div class="list-2">
              <div class="list-2">
                <div class="menu-item"><div class="text-wrapper-2">メニュー</div></div>
                <div class="menu-item-2">
                  <img class="group" src="https://c.animaapp.com/qM6Db6i8/img/group@2x.png" />
                  <div class="text-wrapper-3">活動登録</div>
                </div>
                <div class="menu-item-3">
                  <img class="element" src="https://c.animaapp.com/qM6Db6i8/img/----------1-2@2x.png" />
                  <div class="text-wrapper-3">部署登録</div>
                </div>
                <div class="menu-item-3">
                  <img class="SNS" src="https://c.animaapp.com/qM6Db6i8/img/sns-------4-1.svg" />
                  <div class="text-wrapper-3">部員登録承認</div>
                </div>
                <div class="menu-item-3">
                  <img class="element" src="https://c.animaapp.com/qM6Db6i8/img/-----------2@2x.png" />
                  <div class="text-wrapper-3">部員登録申請</div>
                </div>
              </div>
            </div>
          </div>
          <div class="title">社内イベント管理</div>
        </div>
        <div class="form-field">
          <div class="label-description-3">
            <div class="div-2">
              <div class="label-wrapper">
                <div class="div-2"><div class="label">*活動説明</div></div>
                <div class="elements-label"><div class="optional"></div></div>
              </div>
            </div>
          </div>
          <div class="text-area">
            <div class="text-area-base">
              <input class="input-area" placeholder="Placeholder text" type="text" />
              <div class="text-area-icon">
                <div class="overlap-group">
                  <img class="rectangle" src="https://c.animaapp.com/qM6Db6i8/img/rectangle-10.svg" />
                  <img class="img" src="https://c.animaapp.com/qM6Db6i8/img/rectangle-11.svg" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="title-2">部署情報登録</div>
        <button class="button">
          <div class="button-base"><div class="button-text">戻る</div></div>
        </button>
        <div class="frame">
          <div class="div-2">
            <button class="button-base-wrapper">
              <div class="button-base-2"><div class="button-text-2">登録</div></div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
